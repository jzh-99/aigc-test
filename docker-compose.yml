name: aigc-platform

# ============================================================
# 本地开发用：仅启动基础设施（PostgreSQL + Redis）
# 应用服务在本机直接 pnpm dev 运行
# 对象存储使用火山引擎 TOS（需在 .env 中配置 TOS_* 环境变量）
# 生产部署请使用 deploy/ 目录下的各服务独立配置
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aigc
      POSTGRES_PASSWORD: aigcpass
      POSTGRES_DB: aigc_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
